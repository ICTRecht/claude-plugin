# SIMPELE pad: eigen token-geauthenticeerde MCP-server achter een TLS-proxy.
# Geen extra infrastructuur (geen gateway/Postgres/Redis). Geschikt voor Copilot Studio
# en desktop-clients (Bearer-token). Voor Claude.ai/ChatGPT WEB-connectors is OAuth nodig
# -> zie README.md (gebruik dan docker-compose.yml met ContextForge ervoor).
#
# Starten:
#   cp .env.example .env   # vul OPENWEBUI_* in
#   docker compose -f docker-compose.simple.yml build
#   docker compose -f docker-compose.simple.yml run --rm mcpserver python manage_tokens.py issue --label "Klant X" --ttl-days 90
#   docker compose -f docker-compose.simple.yml up -d
services:
  mcpserver:
    build: ./server
    restart: unless-stopped
    env_file: .env
    volumes:
      - tokendata:/data
    expose:
      - "8000"            # NIET publiek; alleen via de proxy bereikbaar
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [mcpserver]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.simple.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  tokendata:
