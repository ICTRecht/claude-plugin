# TLS-terminatie + routing voor het OAuth-pad.
#   mcp.<domein> -> ContextForge-gateway (MCP-endpoint + admin + OAuth-callbacks)
#   idp.<domein> -> Keycloak (login-UI van klanten)
# Plaats certificaten in ./nginx/certs/ (fullchain.pem + privkey.pem; bv. wildcard *.jouwbedrijf.nl).
worker_processes auto;
events { worker_connections 1024; }

http {
    limit_req_zone $binary_remote_addr zone=mcp:10m rate=20r/s;

    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── MCP-gateway ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name mcp.jouwbedrijf.nl;          # <-- pas aan

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        client_max_body_size 1m;

        location / {
            limit_req zone=mcp burst=40 nodelay;
            proxy_pass http://gateway:4444;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Streamable HTTP / SSE
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }

    # ── Keycloak (IdP-login) ──────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name idp.jouwbedrijf.nl;          # <-- pas aan

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location / {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
