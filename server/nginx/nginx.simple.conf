# TLS-terminatie + security headers + L7-rate-limit voor de EIGEN MCP-server (simpele pad).
# Plaats cert in ./nginx/certs/ (fullchain.pem + privkey.pem). Zie nginx/README.md.
worker_processes auto;
events { worker_connections 1024; }

http {
    limit_req_zone $binary_remote_addr zone=mcp:10m rate=20r/s;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;   # forceer HTTPS
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        client_max_body_size 1m;

        location / {
            limit_req zone=mcp burst=40 nodelay;
            proxy_pass http://mcpserver:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streamable HTTP / SSE-ondersteuning
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
